<script src="assets/storage.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
<script src="assets/audio-speed.js"></script>
<script src="assets/roblox.js"></script>
<script src="assets/player.js"></script>
<script>
(function(){
  "use strict";
  const { getLibrary, saveLibrary, loadBlob, deleteBlob, escapeHtml, statusLabel,
          toast, renderPlanBadges } = Baxdev;

  const players = new Map(); // track.id -> player handle, so we can destroy on re-render

  async function renderLibrary(){
    const library = getLibrary();
    const el = document.getElementById("libraryList");

    players.forEach(p => p.destroy());
    players.clear();

    if(!library.length){
      el.innerHTML = '<p class="empty-state">Belum ada audio. <a href="upload.html">Upload dulu di sini →</a></p>';
      return;
    }

    el.innerHTML = library.map(t => `
      <div class="track" data-id="${t.id}">
        <div class="track-top">
          <div class="track-tags">
            <span class="track-src">${t.source === "youtube" ? "YOUTUBE" : "FILE"}</span>
            ${t.speed && t.speed !== 1 ? `<span class="track-speed">${t.speed}×</span>` : ""}
          </div>
          <span class="status-pill status-${t.status}">${statusLabel(t.status)}</span>
        </div>
        <input class="text-input track-name" placeholder="Nama asset" value="${escapeHtml(t.name)}" maxlength="30">
        <p class="hint track-name-count" style="margin-top:-8px;">${t.name.length}/30</p>
        <input class="text-input track-desc" placeholder="Deskripsi (opsional)" value="${escapeHtml(t.description||"")}">
        <div class="player-slot"></div>
        <div class="progress-row" style="display:none;">
          <div class="progress-bar"><i></i></div>
          <span class="progress-pct">0%</span>
        </div>
        ${t.status==="published" && t.assetId ? `
        <div class="asset-id-row">
          <a class="asset-id-link" href="https://www.roblox.com/library/${encodeURIComponent(t.assetId)}" target="_blank" rel="noopener" title="Buka di Roblox">
            <span class="asset-id-lbl">ID</span>
            <span class="asset-id-val">${escapeHtml(t.assetId)}</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>
          </a>
          <button class="btn-copy-id" type="button" data-copy="${escapeHtml(t.assetId)}" title="Salin Asset ID" aria-label="Salin Asset ID">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>
          </button>
        </div>` : ""}
        ${t.status==="published" && !t.assetId && t.operationPath ? `
        <div class="asset-id-pending">
          <span>ID aset masih diproses Roblox (moderasi audio)...</span>
          <button class="btn btn-ghost btn-check-status" style="padding:6px 12px;font-size:.76rem;">Cek Status</button>
        </div>` : ""}
        <div class="track-actions">
          <button class="btn btn-primary btn-publish" ${t.status==="publishing"?"disabled":""}>${t.status==="published" ? "Publish Ulang" : "Publish ke Roblox"}</button>
          <button class="btn btn-danger btn-remove">Hapus</button>
        </div>
        ${t.message ? `<p class="track-msg ${t.status==="failed"?"err":""}">${escapeHtml(t.message)}</p>` : ""}
      </div>
    `).join("");

    // stagger the card entrance animation so they cascade in one by one
    // instead of all popping in at once
    el.querySelectorAll(".track").forEach((row, i) => {
      row.style.animationDelay = `${Math.min(i, 10) * 55}ms`;
    });

    // mount preview players asynchronously from IndexedDB
    for(const t of library){
      const row = el.querySelector(`.track[data-id="${t.id}"]`);
      if(!row) continue;
      try{
        const blob = await loadBlob(t.id);
        if(blob) players.set(t.id, BaxdevPlayer.mount(row.querySelector(".player-slot"), blob));
      }catch(e){ console.error(e); }
    }

    el.querySelectorAll(".track").forEach(row=>{
      const id = row.dataset.id;
      const nameInput = row.querySelector(".track-name");
      const nameCount = row.querySelector(".track-name-count");
      nameInput.addEventListener("input", ()=>{
        nameCount.textContent = `${nameInput.value.length}/30`;
      });
      nameInput.addEventListener("change", e=>{
        const clamped = Baxdev.clampAssetName(e.target.value);
        e.target.value = clamped;
        nameCount.textContent = `${clamped.length}/30`;
        const lib = getLibrary();
        const t = lib.find(x=>x.id===id);
        if(t){ t.name = clamped; saveLibrary(lib); }
      });
      row.querySelector(".track-desc").addEventListener("change", e=>{
        const lib = getLibrary();
        const t = lib.find(x=>x.id===id);
        if(t){ t.description = e.target.value; saveLibrary(lib); }
      });
      row.querySelector(".btn-remove").addEventListener("click", async ()=>{
        let lib = getLibrary();
        lib = lib.filter(x=>x.id!==id);
        saveLibrary(lib);
        await deleteBlob(id);
        renderLibrary();
        renderPlanBadges();
      });
      row.querySelector(".btn-publish").addEventListener("click", ()=>publishTrack(id));

      const btnCopyId = row.querySelector(".btn-copy-id");
      if(btnCopyId){
        btnCopyId.addEventListener("click", async ()=>{
          const ok = await Baxdev.copyText(btnCopyId.dataset.copy);
          toast(ok ? "Asset ID disalin" : "Gagal menyalin", !ok);
        });
      }

      const btnCheck = row.querySelector(".btn-check-status");
      if(btnCheck){
        btnCheck.addEventListener("click", async ()=>{
          btnCheck.disabled = true;
          btnCheck.textContent = "Mengecek...";
          const result = await BaxdevRoblox.checkAssetStatus(id);
          if(!result.ok){
            toast(result.message || "Gagal cek status", true);
            btnCheck.disabled = false;
            btnCheck.textContent = "Cek Status";
            return;
          }
          if(!result.done){
            toast("Masih diproses Roblox, coba lagi sebentar lagi.");
            btnCheck.disabled = false;
            btnCheck.textContent = "Cek Status";
            return;
          }
          toast(result.error ? (result.message || "Roblox menolak asset ini") : `Asset ID siap: ${result.assetId}`, !!result.error);
          renderLibrary();
        });
      }
    });
  }

  async function publishTrack(id){
    const row = document.querySelector(`.track[data-id="${id}"]`);
    if(!row) return;
    const btn = row.querySelector(".btn-publish");
    const pill = row.querySelector(".status-pill");
    const progRow = row.querySelector(".progress-row");
    const progBar = row.querySelector(".progress-bar i");
    const progPct = row.querySelector(".progress-pct");

    btn.disabled = true;
    progRow.style.display = "flex";
    progBar.style.width = "0%";
    progPct.textContent = "0%";

    const result = await BaxdevRoblox.publishTrackById(id, {
      onStart(){
        pill.className = "status-pill status-publishing";
        pill.textContent = statusLabel("publishing");
      },
      onProgress(pct){
        progBar.style.width = pct + "%";
        progPct.textContent = pct + "%";
      }
    });

    progRow.style.display = "none";

    if(result.code === "missing_settings"){
      toast(result.message, true);
      location.href = "settings.html";
      return;
    }
    if(result.code === "quota"){
      toast(result.message, true);
      btn.disabled = false;
      return;
    }

    toast(result.ok ? (result.message || "Berhasil dipublish ke Roblox") : "Publish gagal, lihat detail di Library", !result.ok);
    renderLibrary();
    renderPlanBadges();
  }

  renderLibrary();
})();
</script>
